plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matrix.agent'
    compileSdk 36

    defaultConfig {
        applicationId 'com.matrix.agent'
        minSdk 28
        targetSdk 36
        versionCode 10
        versionName '0.5.5'

        // V0.5.1 Stage 5:启用 androidTest 仪器化测试入口。
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Voice V1 Stage 2:Vosk native 只打 arm64-v8a(对齐 :ondevice,裁多 ABI 减包体)。
        ndk {
            abiFilters 'arm64-v8a'
        }

        // V0.5.0 Stage 2:Room annotationProcessor 生成 _Impl.java + schema JSON 落盘
        // (V0.5.1 引入 src/androidTest 时,迁移测试也会用此 schema)。
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental": "true"
                ]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    // V0.5.1 Stage 5:启用 androidTest 源集(V0.5.0 占位升级)。
    // assets 显式声明:voicecert 正向唤醒门禁样本(VoskRecognizeTest 读测试 APK assets)。
    sourceSets {
        androidTest {
            java.srcDirs = ['src/androidTest/java']
            assets.srcDirs = ['src/androidTest/assets']
        }
    }

    // V0.5.0 Stage 2:jtokkit (Stage 5 加) / SQLCipher 含 kotlin stdlib,排除 META-INF 冲突。
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // 端侧 MNN 推理 library（阶段0：仅引入模块以触发 native 构建并验证端到端打包；
    // 阶段1 起在 platform/OnDeviceModelGateway 引用 OnDeviceLlm 接口）
    implementation project(':ondevice')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // V0.5.0 Stage 2:Room(pure Java annotationProcessor,不用 KSP/RxJava/Coroutines)
    implementation 'androidx.room:room-runtime:2.7.0'
    annotationProcessor 'androidx.room:room-compiler:2.7.0'

    // V0.5.0 Stage 2:SQLCipher + androidx sqlite 兼容入口(SupportFactory)
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-framework:2.4.0'

    // V0.5.0 Stage 5:jtokkit BPE Tokenizer(V0.5.0 仅提供能力,V0.5.1 切主路径)
    implementation 'com.knuddels:jtokkit:1.1.0'

    // Voice V1 Stage 2:Vosk 离线 ASR/KWS(预编译 aar,含 native .so;Maven Central 0.3.75)。
    debugImplementation 'com.alphacephei:vosk-android:0.3.75'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // V0.5.1 Stage 5:androidTest 仪器化测试依赖(无 Espresso / Robolectric,纯 JVM 风格)。
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1' // GrantPermissionRule(语音采音仪器测试)
    androidTestImplementation 'androidx.room:room-testing:2.7.0'
    // room-testing 间接依赖 androidx.test:core,提供 ApplicationProvider。
    // 显式拉一遍以确保 SmokeTest 入口可见。
    androidTestImplementation 'androidx.test:core:1.6.1'
}

// 语音真机认证门禁(app/src/androidTest/.../voicecert 包):需预置 Vosk 模型/真实麦克风/中文 TTS
// 引擎/焦点抢占行为,与常规 connectedDebugAndroidTest 隔离——常规任务中该包测试 Assume 跳过,
// 本任务按包过滤 + voiceCert=true 放行,门禁失败即红。模型预置(应用内下载或 run-as 导入)
// 见 voicecert/VoiceCertification.java 类注释。
tasks.register('connectedVoiceCertificationAndroidTest') {
    group = 'verification'
    description = '语音真机认证门禁(voicecert 包:模型/麦克风/TTS/焦点前提,失败即红)。'
    dependsOn 'installDebug', 'installDebugAndroidTest'
    doLast {
        exec {
            commandLine android.adbExecutable.absolutePath, 'shell', 'am', 'instrument', '-w',
                    '-e', 'package', 'com.matrix.agent.voicecert',
                    '-e', 'voiceCert', 'true',
                    'com.matrix.agent.test/androidx.test.runner.AndroidJUnitRunner'
        }
    }
}
