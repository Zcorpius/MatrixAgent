plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matrix.agent'
    compileSdk 36

    defaultConfig {
        applicationId 'com.matrix.agent'
        minSdk 28
        targetSdk 36
        versionCode 10
        versionName '0.5.5'

        // V0.5.1 Stage 5:启用 androidTest 仪器化测试入口。
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // V0.5.0 Stage 2:Room annotationProcessor 生成 _Impl.java + schema JSON 落盘
        // (V0.5.1 引入 src/androidTest 时,迁移测试也会用此 schema)。
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas".toString(),
                    "room.incremental": "true"
                ]
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    // V0.5.1 Stage 5:启用 androidTest 源集(V0.5.0 占位升级)。
    sourceSets {
        androidTest {
            java.srcDirs = ['src/androidTest/java']
        }
    }

    // V0.5.0 Stage 2:jtokkit (Stage 5 加) / SQLCipher 含 kotlin stdlib,排除 META-INF 冲突。
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // 端侧 MNN 推理 library（阶段0：仅引入模块以触发 native 构建并验证端到端打包；
    // 阶段1 起在 platform/OnDeviceModelGateway 引用 OnDeviceLlm 接口）
    implementation project(':ondevice')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // V0.5.0 Stage 2:Room(pure Java annotationProcessor,不用 KSP/RxJava/Coroutines)
    implementation 'androidx.room:room-runtime:2.7.0'
    annotationProcessor 'androidx.room:room-compiler:2.7.0'

    // V0.5.0 Stage 2:SQLCipher + androidx sqlite 兼容入口(SupportFactory)
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-framework:2.4.0'

    // V0.5.0 Stage 5:jtokkit BPE Tokenizer(V0.5.0 仅提供能力,V0.5.1 切主路径)
    implementation 'com.knuddels:jtokkit:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // V0.5.1 Stage 5:androidTest 仪器化测试依赖(无 Espresso / Robolectric,纯 JVM 风格)。
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.room:room-testing:2.7.0'
    // room-testing 间接依赖 androidx.test:core,提供 ApplicationProvider。
    // 显式拉一遍以确保 SmokeTest 入口可见。
    androidTestImplementation 'androidx.test:core:1.6.1'
}
